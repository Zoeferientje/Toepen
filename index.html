<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WB Toep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WB Toep</title>
<meta name="description" content="Toepen bijhouden in huis: scores, verliezers en statistieken.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Speelkaart licht: witte kaarten op gebroken wit, zwart voor tekst en knoppen, kaartrood als accent.
   Een speler op 1 punt voor verlies wordt een rode kaart; wie verloren heeft een zwarte. */
:root {
  --bg: #f2f1ed;         /* tafel: gebroken wit */
  --card: #ffffff;       /* kaarten en vlakken */
  --line: #dddad3;       /* dunne kaartranden */
  --soft: #ecebe6;       /* uitgeschakelde knoppen, rustige vlakken */
  --ink: #17171a;        /* schoppen-zwart: tekst en knoppen */
  --muted: #6c6b67;
  --red: #c8102e;        /* harten-rood */
  --red-soft: #fbe8eb;
  --green: #1d7a4b;      /* gewonnen */
  --amber: #f2b705;      /* moet mee */
  --white: #ffffff;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --navroom: 64px;       /* vrije ruimte onder de menuknoppen voor de Netlify-balk */
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, a, input, label { touch-action: manipulation; }
button { font: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
main { padding-bottom: calc(96px + var(--navroom) + env(safe-area-inset-bottom)); }

/* Bovenbalk met logo */
.topbar { background: var(--card); border-bottom: 1px solid var(--line); padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 14px; }
.topbar .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.wordmark { grid-column: 2; grid-row: 1; justify-self: center; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  font: 800 2rem/1 var(--display); letter-spacing: .02em; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; padding: 6px 14px; }
.wordmark .card { display: inline-grid; place-items: center; width: 22px; height: 30px; background: var(--card); color: var(--red); border: 1.5px solid var(--ink); border-radius: 3px; font: 700 14px var(--body); transform: rotate(-6deg); }

h2 { font: 800 1.35rem/1.15 var(--display); margin: 0 0 10px; }
h3 { font: 600 12px/1.2 var(--body); margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.section { margin-top: 20px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.empty { color: var(--muted); }
.status { color: var(--muted); font-size: 13px; margin-top: 16px; }

/* Knoppen */
.btn { border: 0; border-radius: 12px; padding: 15px 18px; font-weight: 700; font-size: 17px; background: var(--ink); color: var(--white); }
.btn.dark { background: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; padding: 8px; text-decoration: underline; }
.btn:disabled { opacity: .5; }
.endbar { margin-top: 18px; display: grid; gap: 10px; }

/* Spelscherm: elke speler is een kaart */
.target { margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
.target b { color: var(--ink); }
.players { display: grid; gap: 8px; margin-top: 4px; }
.pcard { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; transition: background .2s, color .2s, border-color .2s; }
.pcard.danger { background: var(--red); border-color: var(--red); color: var(--white); }
.pcard.out { background: var(--ink); border-color: var(--ink); color: var(--white); }
.pinfo { display: grid; gap: 2px; min-width: 0; }
.pname { font-size: 1rem; line-height: 1.2; font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
.pname .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .7; }
.pscore { font: 700 2rem/1 var(--body); font-variant-numeric: tabular-nums; min-width: 2ch; }
.pstate { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.pstate svg { width: 13px; height: 13px; color: var(--amber); }
.pbtns { display: flex; gap: 8px; }
.pbtn { width: 52px; height: 52px; border-radius: 10px; border: 0; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.pbtn svg { width: 28px; height: 28px; }
.pbtn:active, .sbtn:active { transform: scale(.94); }
.pbtn:disabled { background: var(--soft); color: #b5b3ad; }
.pcard.danger .pbtn, .pcard.out .pbtn { background: var(--white); color: var(--red); }
.pcard.out .pbtn { color: var(--ink); }
.pcard.danger .pbtn:disabled, .pcard.out .pbtn:disabled { background: rgba(255,255,255,.25); color: rgba(255,255,255,.6); }

.small { display: grid; justify-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--line); }
.pcard.danger .small, .pcard.out .small { border-left-color: rgba(255,255,255,.3); }
.slabel { font-size: 10px; font-weight: 600; letter-spacing: .03em; text-align: center; line-height: 1.1; color: var(--muted); }
.pcard.danger .slabel, .pcard.out .slabel { color: var(--white); }
.sbtns { display: flex; align-items: center; gap: 5px; }
.scount { display: flex; align-items: center; gap: 3px; margin-right: 2px; font: 700 1rem var(--body); font-variant-numeric: tabular-nums; }
.scount svg { width: 18px; height: 18px; }
.sbtn { width: 38px; height: 38px; border: 0; border-radius: 8px; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.sbtn svg { width: 20px; height: 20px; }
.sbtn[data-small-reset] { background: var(--soft); color: var(--ink); }
.sbtn:disabled { opacity: .4; }
.pcard.danger .sbtn, .pcard.out .sbtn { background: var(--white); color: var(--ink); }
.small.must .slabel { background: var(--amber); color: var(--ink); border-radius: 4px; padding: 1px 6px; }
.small.must .scount { color: var(--red); }
.pcard.danger .small.must .scount { color: var(--white); }

@keyframes bump { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.pscore.bump { animation: bump .18s ease-out; display: inline-block; transform-origin: left center; }

/* Startscherm */
.choose { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 17px; }
.choice:has(input:checked) { border-color: var(--ink); }
.choice input { width: 22px; height: 22px; accent-color: var(--red); }
.choice .tag { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input[type="text"] { flex: 1 1 160px; min-width: 0; }
input[type="text"], input[type="number"] { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px; font: 16px var(--body); }
input[type="number"] { width: 90px; font-weight: 700; text-align: center; }
.smallbtn { border: 0; border-radius: 10px; padding: 12px 14px; background: var(--ink); color: var(--white); font-weight: 600; }

/* Home: drie uitgelichte kaarten, zoals een hand met harten, schoppen en klaveren */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 14px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--white); border-color: var(--ink); }
.hero { margin-top: 16px; }
.hero img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; margin-bottom: 8px; }
.hero > .cap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.hero .big { font: 800 2rem/1.05 var(--display); }
.hero .sub { margin-top: 4px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.trio .cap { position: relative; border-radius: 12px; padding: 14px 12px 30px; background: var(--card); color: var(--ink); border: 1px solid var(--line); min-width: 0; }
.trio .cap::after { position: absolute; right: 10px; bottom: 6px; font-size: 20px; line-height: 1; }
.trio .cap:nth-child(1) { background: var(--red); border-color: var(--red); color: var(--white); }
.trio .cap:nth-child(1)::after { content: "♥"; }
.trio .cap.luck { background: var(--ink); border-color: var(--ink); color: var(--white); }
.trio .cap.luck::after { content: "♠"; }
.trio .cap.smallest::after { content: "♣"; }
.trio .big { font-size: 1.35rem; overflow-wrap: anywhere; margin: 2px 0; }
.trio .sub { font-size: 13px; line-height: 1.3; opacity: .85; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.kpis.two { grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.kpi b { display: block; overflow-wrap: anywhere; font: 800 1.5rem/1.05 var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
.ptable th:first-child, .ptable td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); font-weight: 600; }
.ptable small { color: var(--muted); }
.ptable td.hi { color: var(--red); font-weight: 700; }
.ptable td.good { color: var(--green); font-weight: 700; }
.ptable td.warmth { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.gtag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

.games { list-style: none; margin: 0; padding: 0; }
.games li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.games li:first-child { border-top: 0; }
.games .when { font-size: 13px; color: var(--muted); }
.lost { color: var(--red); font-weight: 700; }
.won { color: var(--green); font-weight: 600; }

/* Uitslag: foto van de verliezer als rode kaart */
.shame { margin: 0 0 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.shame img { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: cover; }
.shame figcaption { padding: 14px 16px 18px; display: grid; gap: 6px; background: var(--red); color: var(--white); }
.shame .who { font: 800 1.5rem/1.1 var(--display); }
.shame .quote { font-size: 1.15rem; font-style: italic; }
.shame .quote::before { content: "“"; } .shame .quote::after { content: "”"; }

/* Onderbalk */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding-bottom: calc(env(safe-area-inset-bottom) + var(--navroom)); }
nav.tabbar .wrap { display: grid; grid-template-columns: 1fr 1fr; }
nav.tabbar a { color: var(--muted); text-decoration: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0 8px; font-size: 13px; font-weight: 600; }
nav.tabbar a svg { width: 22px; height: 22px; }
nav.tabbar a[aria-current="page"] { color: var(--ink); }
nav.tabbar a[aria-current="page"] svg { color: var(--red); }

/* Dialoog en meldingen */
.overlay { position: fixed; inset: 0; background: rgba(23,23,26,.55); display: grid; place-items: center; z-index: 10; padding: 16px; }
.dialog { background: var(--card); border-radius: 16px; padding: 20px; width: min(420px, 100%); display: grid; gap: 10px; max-height: 90vh; overflow-y: auto; }
.dialog h2 { margin: 0; }
.dialog p { margin: 0 0 6px; color: var(--muted); }
.dialog .btn { width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(86px + var(--navroom) + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 10px; font-weight: 500; max-width: calc(100% - 32px); z-index: 11; }

/* Tijdens het spel: compacter, zodat 5 spelers zonder scrollen passen */
body.ingame .topbar { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 8px; }
body.ingame .wordmark { font-size: 1.5rem; padding: 4px 12px; }
body.ingame .wordmark .card { width: 18px; height: 25px; font-size: 12px; }
body.ingame main { padding-bottom: calc(80px + var(--navroom) + env(safe-area-inset-bottom)); }
body.ingame .endbar { margin-top: 10px; gap: 4px; }
body.ingame .endbar .btn:not(.ghost) { padding: 12px; font-size: 16px; }
body.ingame .endbar .btn.ghost { padding: 4px; font-size: 13px; }

@media (display-mode: standalone) { :root { --navroom: 6px; } }
@media (max-width: 380px) { .pbtn { width: 48px; height: 48px; } .sbtn { width: 36px; height: 36px; } .pscore { font-size: 1.8rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .pscore.bump { animation: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="wordmark" aria-label="WB Toep">WB T<span class="card">♥</span>EP</div>
  </div>
</header>

<main class="wrap">
  <section id="view-home"></section>
  <section id="view-spel" hidden></section>
  <p class="status" id="status"></p>
</main>

<nav class="tabbar" aria-label="Menu">
  <div class="wrap">
    <a href="#home" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="#spel" data-route="spel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="11" height="15" rx="2" transform="rotate(-10 8.5 12.5)"/><rect x="10" y="4" width="11" height="15" rx="2" transform="rotate(10 15.5 11.5)" fill="currentColor"/></svg>
      Toepen
    </a>
  </div>
</nav>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const SUPABASE_URL = "https://ghnmlxgevbulijkwdmqq.supabase.co";
const SUPABASE_KEY = "sb_publishable_rKV5N1N9TFuMbQ7_jP_JwA_HblVBJ_1";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };

const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"><path d="M12 4v16M4 12h16"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"><path d="M4 12h16"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="#e3b341" stroke="#9a7317" stroke-width="1.2"><path d="M7 3h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 4M17 5h3a3 3 0 0 1-3 4" fill="none" stroke-width="1.8"/><path d="M10 12h4v4h-4zM7 19h10v2H7zM9 16h6v3H9z"/></svg>',
  siren: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18v-6a6 6 0 0 1 12 0v6z" fill="#e8434a"/><path d="M9 12a3 3 0 0 1 3-3" stroke="#ffd2d2" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="4" y="18" width="16" height="3" rx="1" fill="#cfcfcf"/></svg>',
  reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22z"/><path d="M12 9v5M12 17v.5" stroke="#17171a" stroke-width="2.2" stroke-linecap="round"/></svg>',
};

/* ---------- Status ---------- */
const S = {
  players: [],      // {id, name, is_guest}
  active: null,     // {id, target, round, started_at}
  gps: [],          // deelnemers van het actieve spel {id, player_id, score}
  history: [],      // afgeronde spellen met deelnemers
  homePeriod: "altijd",
  result: null,     // uitslag om te tonen na afsluiten
  busy: false,
};
try { S.homePeriod = localStorage.getItem("homePeriod") === "maand" ? "maand" : "altijd"; } catch (e) {}

const nameOf = (pid) => S.players.find((p) => p.id === pid)?.name || "Onbekend";
const isGuest = (pid) => !!S.players.find((p) => p.id === pid)?.is_guest;

/* ---------- Data ophalen ---------- */
async function loadPlayers() {
  const r = await db.from("players").select("id,name,is_guest").order("name");
  if (r.error) throw r.error;
  S.players = r.data;
}
// Per speler-in-spel: hoeveel opslagacties nog onderweg zijn, en wanneer de laatste klaar was.
const inFlight = new Map(), doneAt = new Map();
async function loadActive() {
  const asked = performance.now(); // moment van opvragen
  const g = await db.from("games").select("id,target,round,started_at").eq("status", "active").maybeSingle();
  if (g.error) throw g.error;
  if (!g.data) { S.active = null; S.gps = []; return; }
  const r = await db.from("game_players").select("id,player_id,score,small_current").eq("game_id", g.data.id);
  if (r.error) throw r.error;
  const old = new Map(S.gps.map((x) => [x.id, x]));
  S.active = g.data;
  S.gps = r.data.map((fresh) => {
    const mine = old.get(fresh.id);
    if (!mine) return fresh;
    // Alleen overnemen als er niets van deze telefoon onderweg is én dit antwoord is opgevraagd
    // nadat onze laatste tik was opgeslagen. Anders zou een oud antwoord je tik terugdraaien.
    if (!(inFlight.get(fresh.id) > 0) && asked >= (doneAt.get(fresh.id) || 0)) {
      mine.score = fresh.score; mine.small_current = fresh.small_current;
    }
    return mine;
  }).sort((a, b) => isGuest(a.player_id) - isGuest(b.player_id) || nameOf(a.player_id).localeCompare(nameOf(b.player_id), "nl"));
}
// Wacht tot alle tikken van deze telefoon zijn opgeslagen (max 8 seconden).
async function settled() {
  const until = Date.now() + 8000;
  while ([...inFlight.values()].some((n) => n > 0) && Date.now() < until) await new Promise((r) => setTimeout(r, 100));
}
async function loadHistory() {
  const r = await db.from("games").select("id,ended_at,target,game_players(player_id,score,lost,won,small_total)").eq("status", "finished").order("ended_at", { ascending: false }).limit(1000);
  if (r.error) throw r.error;
  S.history = r.data;
}
async function showFinished(id) {
  const r = await db.from("games").select("status,game_players(player_id,score,lost,won)").eq("id", id).maybeSingle();
  if (r.error || !r.data || r.data.status !== "finished") return;
  const gp = r.data.game_players;
  S.result = { losers: gp.filter((x) => x.lost).map((x) => nameOf(x.player_id)), winners: gp.filter((x) => x.won).map((x) => nameOf(x.player_id)) };
  loadHistory().then(() => { if (route() === "home") render(); }).catch(() => {});
}
async function refresh(which = "all") {
  try {
    if (which === "all") { await loadPlayers(); await Promise.all([loadActive(), loadHistory()]); }
    else if (which === "game") {
      const prev = S.active?.id;
      await loadActive();
      if (prev && !S.active && !S.result) await showFinished(prev);
    }
    $("status").textContent = "";
    render();
  } catch (e) {
    console.error(e);
    $("status").textContent = "Kan de gegevens niet ophalen. Controleer je internet en ververs de pagina.";
  }
}

/* ---------- Home ---------- */
function periodStart(p) {
  const now = new Date();
  if (p === "maand") return new Date(now.getFullYear(), now.getMonth(), 1);
  if (p === "jaar") return new Date(now.getFullYear(), 0, 1);
  return null;
}
function statsFor(games) {
  // Eerlijke verwachting per potje: ieder krijgt zijn "eerlijke deel" van wat er in dát potje gebeurde.
  // - Verliezen: aantal verliezers in het potje / aantal spelers (meestal 1/n; bij 2 verliezers 2/n).
  //   De eindscore (10, 15, ...) verandert dit niet: er is altijd precies dat aantal verliezers.
  // - Winnen: aantal winnaars / aantal spelers (gedeelde winst telt mee).
  // - Kleine spelers: totaal kleine spelers in het potje / aantal spelers. Zo vergelijk je alleen met
  //   wie er in hetzelfde potje zat, en telt een kort potje (tot 10) vanzelf minder zwaar dan een lang potje.
  const m = new Map();
  for (const g of games) {
    const gp = g.game_players, n = gp.length || 1;
    const losers = gp.filter((x) => x.lost).length, winners = gp.filter((x) => x.won).length;
    const smallSum = gp.reduce((a, x) => a + (x.small_total || 0), 0);
    const w15 = 15 / (g.target || 15); // omrekenen naar een potje tot 15
    for (const x of gp) {
      const s = m.get(x.player_id) || { pid: x.player_id, played: 0, lost: 0, won: 0, expL: 0, expW: 0, small: 0, expS: 0, small15: 0 };
      s.played++;
      s.expL += losers / n; s.expW += winners / n; s.expS += smallSum / n;
      s.small += x.small_total || 0; s.small15 += (x.small_total || 0) * w15;
      if (x.lost) s.lost++; if (x.won) s.won++;
      m.set(x.player_id, s);
    }
  }
  // Reeksen: potjes van oud naar nieuw doorlopen per speler.
  for (const g of [...games].sort((a, b) => new Date(a.ended_at) - new Date(b.ended_at))) {
    for (const x of g.game_players) {
      const s = m.get(x.player_id);
      if (x.lost) { s.curL = (s.curL || 0) + 1; s.curN = 0; }
      else { s.curN = (s.curN || 0) + 1; s.curL = 0; }
      s.maxL = Math.max(s.maxL || 0, s.curL); s.maxN = Math.max(s.maxN || 0, s.curN);
    }
  }
  const list = [...m.values()];
  for (const s of list) {
    s.fL = s.expL ? s.lost / s.expL : 0;
    s.fW = s.expW ? s.won / s.expW : 0;
    s.fS = s.expS ? s.small / s.expS : 0;
  }
  return list.sort((a, b) => b.fL - a.fL || b.lost - a.lost || nameOf(a.pid).localeCompare(nameOf(b.pid), "nl"));
}
const nl1 = (x) => x.toFixed(1).replace(".", ",");
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + "%";
function fmtDate(iso) {
  return new Date(iso).toLocaleString("nl-NL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function factorText(f, word) {
  if (f === 0) return `nog nooit ${word}`;
  return `${nl1(f)}× zo vaak ${word} als verwacht`;
}
function renderHome() {
  const start = periodStart(S.homePeriod);
  const games = S.history.filter((g) => !start || new Date(g.ended_at) >= start);
  const stats = statsFor(games);
  // Uitschieters alleen uit spelers met genoeg potjes (3), zodat één potje niet alles bepaalt.
  const minGames = stats.some((s) => s.played >= 3) ? 3 : 1;
  const pool = stats.filter((s) => s.played >= minGames);
  const pick = (score) => [...pool].sort((a, b) => score(b) - score(a) || b.played - a.played)[0];
  const worst = pick((s) => s.fL);
  // Minste verliezer: laagste verliesfactor (bij gelijkspel wie de meeste potjes speelde), niet dezelfde als de pechvogel.
  const luckiest = [...pool].filter((s) => s !== worst || pool.length === 1)
    .sort((a, b) => a.fL - b.fL || b.played - a.played)[0];
  const smallest = pick((s) => s.fS);
  const recL = [...stats].sort((a, b) => b.maxL - a.maxL || b.curL - a.curL)[0];
  const recN = [...stats].sort((a, b) => b.maxN - a.maxN || b.curN - a.curN)[0];
  const last = games[0];
  const lastLosers = last ? last.game_players.filter((x) => x.lost).map((x) => nameOf(x.player_id)) : [];
  const card = (cls, label, s, value) => `<div class="cap ${cls}"><div class="sub">${label}</div>${
    s && value(s).ok ? `<div class="big">${esc(nameOf(s.pid))}</div><div class="sub">${value(s).text}</div>` : `<div class="big">–</div><div class="sub">nog niemand</div>`}</div>`;

  $("view-home").innerHTML = `
    <div class="tabs" role="group" aria-label="Periode" style="margin-top:16px">
      ${["maand", "altijd"].map((p) => `<button type="button" data-home-period="${p}" aria-pressed="${S.homePeriod === p}">${{ maand: "Deze maand", altijd: "All-time" }[p]}</button>`).join("")}
    </div>

    <div class="hero">
      <img src="foto.jpg" alt="Het huis aan tafel" onerror="this.remove()">
      ${games.length ? `<div class="trio">
        ${card("", "Pechvogel", worst, (s) => ({ ok: s.lost > 0, text: `${nl1(s.fL)}× zo vaak verloren als verwacht` }))}
        ${card("luck", "Minste verliezer", luckiest !== worst ? luckiest : null, (s) => ({ ok: true, text: s.lost === 0 ? `nog nooit verloren in ${s.played} ${s.played === 1 ? "potje" : "potjes"}` : `${nl1(s.fL)}× zo vaak verloren als verwacht` }))}
        ${card("smallest", "Kleinste speler", smallest, (s) => ({ ok: s.small > 0, text: `${nl1(s.fS)}× zo vaak niet mee als verwacht` }))}
      </div>` : `<div class="cap"><div class="big">Nog geen potjes</div><div class="sub">Start een spel via Toepen onderin.</div></div>`}
    </div>

    <div class="kpis two">
      <div class="kpi"><b>${games.length}</b><span>potjes gespeeld</span></div>
      <div class="kpi"><b>${last ? esc(lastLosers.join(", ") || "–") : "–"}</b><span>laatste verliezer</span></div>
      <div class="kpi"><b>${recL && recL.maxL ? `${esc(nameOf(recL.pid))} · ${recL.maxL}` : "–"}</b><span>langste verliesreeks${recL && recL.curL === recL.maxL && recL.maxL > 1 ? " (loopt nog)" : ""}</span></div>
      <div class="kpi"><b>${recN && recN.maxN ? `${esc(nameOf(recN.pid))} · ${recN.maxN}` : "–"}</b><span>langst zonder verlies${recN && recN.curN === recN.maxN && recN.maxN > 1 ? " (loopt nog)" : ""}</span></div>
    </div>

    <div class="section panel">
      <h2>Per speler</h2>
      ${stats.length ? `<div class="tablewrap"><table class="ptable">
        <thead><tr><th>Speler</th><th>Potjes</th><th>Verloren</th><th>Factor</th><th>Gewonnen</th><th>Factor</th><th>Kleine sp.</th><th title="Gemiddeld per potje, omgerekend naar een potje tot 15">Per potje*</th><th>Factor</th><th>Verliesreeks</th><th>Zonder verlies</th></tr></thead>
        <tbody>${stats.map((s) => `<tr>
          <td>${esc(nameOf(s.pid))}${isGuest(s.pid) ? ' <span class="gtag">gast</span>' : ""}</td>
          <td>${s.played}</td>
          <td>${s.lost} <small>(${pct(s.lost, s.played)})</small></td>
          <td class="${s.fL > 1 ? "hi" : ""}">${nl1(s.fL)}</td>
          <td>${s.won} <small>(${pct(s.won, s.played)})</small></td>
          <td class="${s.fW > 1 ? "good" : ""}">${nl1(s.fW)}</td>
          <td>${s.small}</td>
          <td>${nl1(s.small15 / s.played)}</td>
          <td class="${s.fS > 1 ? "warmth" : ""}">${nl1(s.fS)}</td>
          <td>${s.curL} <small>(rec. ${s.maxL})</small></td>
          <td>${s.curN} <small>(rec. ${s.maxN})</small></td>
        </tr>`).join("")}</tbody></table></div>
        <p class="hint">Factor 1,0 is precies gemiddeld. Met 3 spelers verlies je verwacht 1 op de 3 potjes, met 5 spelers 1 op de 5. Factor 2,0 is twee keer zo vaak als verwacht. Bij kleine spelers word je per potje vergeleken met de anderen in hetzelfde potje, dus een kort potje (tot 10) telt vanzelf minder zwaar. *Per potje is omgerekend naar een potje tot 15. Reeksen: het eerste getal is de reeks van nu, "rec." het record.</p>`
        : `<p class="empty">Nog geen afgeronde potjes in deze periode.</p>`}
    </div>

    <div class="section panel">
      <h2>Laatste potjes</h2>
      ${games.length ? `<ul class="games">${games.slice(0, 8).map((g) => {

        return `<li><span class="when">${fmtDate(g.ended_at)} · ${g.game_players.length} spelers · tot ${g.target}</span>
          <span>Verloren: <span class="lost">${losers.join(", ") || "niemand"}</span></span>
          <span>Gewonnen: <span class="won">${winners.join(", ") || "–"}</span></span></li>`;
      }).join("")}</ul>` : `<p class="empty">Nog geen potjes gespeeld.</p>`}
    </div>`;
}

    }).join("")}</div>
    <div class="endbar">

}

function updateCard(gp) {
  const card = document.querySelector(`[data-card="${gp.id}"]`);
  if (!card || !S.active) return;
  const t = S.active.target;
  const out = gp.score >= t, danger = gp.score === t - 1, must = gp.small_current >= 2;
  card.classList.toggle("out", out);
  card.classList.toggle("danger", danger);
  const sc = card.querySelector(".pscore");
  if (sc.textContent !== String(gp.score)) {
    sc.textContent = gp.score;
    sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); // kort oplichten als bevestiging
  }
  const st = card.querySelector(".pstate");
  st.hidden = !(out || danger);
  st.innerHTML = out ? `${ICON.warn} Verloren` : danger ? `${ICON.warn} Nog 1 punt` : "";
  card.querySelector('[data-d="1"]').disabled = out;
  card.querySelector('[data-d="-1"]').disabled = gp.score <= 0;
  const small = card.querySelector(".small");
  small.classList.toggle("must", must);
  small.querySelector(".slabel").textContent = must ? "Moet mee!" : "Kleine spelers";
  small.querySelector(".scount b").textContent = gp.small_current;
  small.querySelector("[data-small]").disabled = out;
  small.querySelector("[data-small-reset]").disabled = gp.small_current === 0;
}

/* ---------- Dialoog en meldingen ---------- */
function ask(title, text, options) {
  // options: [{label, value, style}] -> belooft de gekozen value (of null bij annuleren)
  return new Promise((resolve) => {
    $("dialog").innerHTML = `<h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}${options.map((o, i) => `<button class="btn ${o.style || ""}" type="button" data-i="${i}">${esc(o.label)}</button>`).join("")}`;
    $("overlay").hidden = false;
    $("dialog").querySelector("button")?.focus();
    $("dialog").onclick = (e) => {
      const b = e.target.closest("button[data-i]"); if (!b) return;
      $("overlay").hidden = true; resolve(options[+b.dataset.i].value);
    };
  });
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2500);
}

/* ---------- Tikken op het spelscherm ---------- */
async function change(id, apply, save, field) {
  const gp = S.gps.find((x) => x.id === id);
  if (!gp || !S.active) return;
  apply(gp);                       // 1. meteen tonen
  updateCard(gp);
  try { navigator.vibrate?.(12); } catch (e) {}
  inFlight.set(id, (inFlight.get(id) || 0) + 1);
  let r;
  try { r = await save(id); } catch (err) { r = { error: err }; } // 2. opslaan in de database
  const left = inFlight.get(id) - 1;
  inFlight.set(id, left);
  if (left === 0) doneAt.set(id, performance.now());
  if (r.error) { toast("Opslaan lukte niet. Probeer het opnieuw."); if (left === 0) refresh("game"); return; }
  // 3. Pas als alle tikken binnen zijn de waarde van de database overnemen (die telt ook tikken van andere telefoons mee).
  if (left === 0 && typeof r.data === "number") { gp[field] = r.data; updateCard(gp); }
}

$("view-spel").addEventListener("click", async (e) => {
  const adj = e.target.closest("[data-adj]");
  if (adj) {
    const d = +adj.dataset.d;
    return change(adj.dataset.adj, (gp) => { gp.score = Math.max(0, Math.min(S.active.target, gp.score + d)); },
      (id) => db.rpc("adjust_score", { p_id: id, p_delta: d }), "score");
  }
  const sm = e.target.closest("[data-small]");
  if (sm) {
    return change(sm.dataset.small, (gp) => { gp.small_current++; },
      (id) => db.rpc("add_small", { p_id: id }), "small_current");
  }
  const smr = e.target.closest("[data-small-reset]");
  if (smr) {
    return change(smr.dataset.smallReset, (gp) => { gp.small_current = 0; },
      (id) => db.rpc("reset_small", { p_id: id }), "small_current");
  }

  if (e.target.id === "btn-start") {
    const target = parseInt($("target").value, 10);
    if (!(target >= 2 && target <= 100)) return toast("Kies een eindscore tussen 2 en 100.");
    const ids = [...setupChecked].filter((id) => S.players.some((p) => p.id === id));
    if (ids.length < 2) return toast("Kies minstens 2 spelers.");
    e.target.disabled = true;
    const g = await db.from("games").insert({ target }).select("id").single();
    if (g.error) {
      e.target.disabled = false;
      await refresh("game");
      return toast(S.active ? "Er is al een spel bezig." : "Starten lukte niet. Probeer het opnieuw.");
    }
    const ins = await db.from("game_players").insert(ids.map((player_id) => ({ game_id: g.data.id, player_id })));
    if (ins.error) { toast("Spelers toevoegen lukte niet."); }
    setupChecked = null;
    await refresh("game");
    return;
  }

  if (e.target.id === "btn-end") return endGame();

  if (e.target.id === "btn-cancel") {
    const ok = await ask("Spel annuleren?", "Dit potje wordt niet meegeteld in de statistieken.", [
      { label: "Ja, annuleren", value: true }, { label: "Terug", value: false, style: "ghost" }]);
    if (!ok) return;
    await db.from("games").update({ status: "cancelled", ended_at: new Date().toISOString() }).eq("id", S.active.id);
    toast("Spel geannuleerd");
    return refresh("all");
  }

  if (e.target.id === "btn-new") { S.result = null; return refresh("all"); }
});

$("view-spel").addEventListener("click", (e) => { if (e.target.id === "btn-home") S.result = null; });

async function endGame() {
  await settled();        // eerst alle tikken van deze telefoon laten opslaan
  await refresh("game"); // dan de laatste stand ophalen
  if (!S.active) return;
  const t = S.active.target;
  const atTarget = S.gps.filter((x) => x.score >= t);
  let losers;
  if (atTarget.length === 1) {
    const ok = await ask("Einde spel?", `${nameOf(atTarget[0].player_id)} staat op ${t} en heeft verloren.`, [
      { label: "Spel afsluiten", value: true }, { label: "Terug", value: false, style: "ghost" }]);
    if (!ok) return;
    losers = [atTarget[0].player_id];
  } else {
    const pool = atTarget.length > 1 ? atTarget : S.gps;
    const opts = pool.map((x) => ({ label: `${nameOf(x.player_id)} (${x.score})`, value: [x.player_id] }));
    if (atTarget.length > 1) opts.push({ label: `Allemaal: ${atTarget.map((x) => nameOf(x.player_id)).join(", ")}`, value: atTarget.map((x) => x.player_id) });
    opts.push({ label: "Terug", value: null, style: "ghost" });
    losers = await ask("Wie heeft er verloren?",
      atTarget.length > 1 ? `Meerdere spelers staan op ${t}.` : `Niemand staat op ${t}. Kies wie heeft verloren.`, opts);
    if (!losers) return;
  }
  const lowest = Math.min(...S.gps.filter((x) => !losers.includes(x.player_id)).map((x) => x.score));
  const winners = S.gps.filter((x) => !losers.includes(x.player_id) && x.score === lowest).map((x) => nameOf(x.player_id));
  const r = await db.rpc("finish_game", { p_game: S.active.id, p_losers: losers });
  if (r.error) return toast("Afsluiten lukte niet. Probeer het opnieuw.");
  S.result = { losers: losers.map(nameOf), winners };
  await refresh("all");
}

/* ---------- Scherm aan houden tijdens een potje ---------- */
// Werkt in Safari (recente iOS) en Chrome. Zonder ondersteuning gebeurt er gewoon niets.
let wakeLock = null, wakeBusy = false;
async function syncWakeLock() {
  if (!("wakeLock" in navigator) || wakeBusy) return;
  const want = document.body.classList.contains("ingame") && !document.hidden;
  wakeBusy = true;
  try {
    if (want && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) { /* geweigerd of niet ondersteund: niets aan de hand */ }
  wakeBusy = false;
}
// De telefoon laat het scherm-aan los als je de app even wegklikt; bij terugkomen opnieuw aanzetten.
document.addEventListener("visibilitychange", syncWakeLock);
// Sommige Safari-versies willen dat het verzoek bij een tik hoort: bij elke tik in het spel nog eens proberen.
document.addEventListener("pointerdown", () => { if (!wakeLock) syncWakeLock(); }, { passive: true });

/* ---------- Start ---------- */
window.addEventListener("hashchange", () => { if (route() === "home") S.result = null; render(); });
refresh("all");
// Scores van andere telefoons ophalen: tijdens het spel elke 3 seconden, anders elke 20.
setInterval(() => {
  if (document.hidden || !$("overlay").hidden) return;
  if (route() !== "spel" || S.result) return;
  if (S.active) { if ([...inFlight.values()].some((n) => n > 0)) return; return refresh("game"); }
  // Op het startscherm: alleen verversen als iemand anders een spel is gestart (anders verdwijnt wat je typt).
  loadActive().then(() => { if (S.active) render(); }).catch(() => {});
}, 3000);
setInterval(() => { if (!document.hidden && route() === "home") refresh("all"); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh("all"); });
</script>
